<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3.5 แรงโน้มถ่วง ค่า g และดาวเทียม · Physics Lab</title>
<link rel="stylesheet" href="../lib/physlab.css">
<script src="../lib/physlab.js"></script>
</head>
<body>
<main id="sim"></main>
<script>
/* S3.5 แรงโน้มถ่วง ค่า g และดาวเทียม · บท 3 เรื่อง 12, 13, 14
   สูตร: F = GMm/r² · g = GM/r² · ดาวเทียมสูง h ใช้ r = R + h · G = 6.67×10⁻¹¹ · แบบนิ่ง · แก้ไขล่าสุด 2026-10-27 */
(function () {
  var fmt = PhysLab.fmt, G = 6.67e-11;
  var BODIES = { earth: { label: 'โลก', M: 5.97e24, R: 6.37e6 }, moon: { label: 'ดวงจันทร์', M: 7.35e22, R: 1.74e6 }, mars: { label: 'ดาวอังคาร', M: 6.42e23, R: 3.39e6 }, jupiter: { label: 'ดาวพฤหัส', M: 1.90e27, R: 6.99e7 } };
  function calc(p) { var b = BODIES[p.body], r = b.R + p.h * 1000, g = G * b.M / (r * r), g0 = G * b.M / (b.R * b.R); return { b: b, r: r, g: g, g0: g0, F: g * p.m, W0: g0 * p.m, ratio: g / g0 }; }
  PhysLab.createSim({
    id: 'S3.5', chapter: 3, topics: [12, 13, 14], title: 'แรงโน้มถ่วง ค่า g และดาวเทียม', static: true,
    alt: 'ดาวเคราะห์ทรงกลมมีวัตถุลอยอยู่ที่ความสูง h เหนือผิว ลูกศรแรงโน้มถ่วงชี้เข้าศูนย์กลาง และกราฟค่า g กับระยะจากศูนย์กลางลดลงแบบหนึ่งส่วนระยะกำลังสอง',
    calc: calc,
    params: {
      body: { label: 'ดาว', type: 'choice', options: Object.keys(BODIES).map(function (k) { return { label: BODIES[k].label, value: k }; }), default: 'earth' },
      h: { label: 'ความสูงจากผิวดาว', symbol: 'h', unit: 'km', type: 'range', min: 0, max: 40000, step: 100, default: 0, drag: true },
      m: { label: 'มวลวัตถุ', symbol: 'm', unit: 'kg', type: 'range', min: 1, max: 1000, step: 1, default: 100 }
    },
    presets: [{ label: 'บนผิวโลก', values: { body: 'earth', h: 0 } }, { label: 'สถานีอวกาศ 400 km', values: { body: 'earth', h: 400 } }, { label: 'ดาวเทียม GPS 20,200 km', values: { body: 'earth', h: 20200 } }, { label: 'ค้างฟ้า 35,800 km', values: { body: 'earth', h: 35800 } }, { label: 'บนดวงจันทร์', values: { body: 'moon', h: 0 } }],
    world: { xMin: -1.2, xMax: 7.4, yMin: -2.2, yMax: 2.2 },
    init: function (p) { return calc(p); }, step: function (s) { return s; },
    draw: function (ctx, s, p, D) {
      var c = D.color, Rpx = 1.0, scale = Rpx / s.b.R, maxR = s.b.R + 40000e3, cx = 0, cy = 0;
      D.circle(cx, cy, Rpx, { fill: c.accentSoft, stroke: c.primary, width: 2 });
      D.label(s.b.label + ' M = ' + fmt(s.b.M) + ' kg', cx, cy - 1.25, { align: 'center', color: c.text, size: 12 }); D.label('R = ' + fmt(s.b.R / 1000) + ' km', cx, cy - 1.45, { align: 'center' });
      var ox = Rpx + (s.r - s.b.R) / (maxR - s.b.R) * 2.6, oy = 0;
      D.line(0, 0, ox, 0, { color: c.line, dash: [3, 3], width: 1 }); D.label('r = R + h = ' + fmt(s.r / 1000) + ' km', ox / 2 + 0.5, 0, { dy: 62, align: 'center', color: c.text });
      D.dot(ox, oy, 9, c.orange, { stroke: c.card, width: 2 }); D.label('m = ' + p.m + ' kg · h = ' + fmt(p.h) + ' km', ox, oy, { dy: -18, align: 'center' });
      var ak = 0.9 * Math.min(1, s.ratio); D.arrow(ox, oy, -ak - 0.05, 0, { color: c.red, label: 'F = ' + fmt(s.F) + ' N', width: 3.5, dy: 18 }); 
      D.label('g ที่นี่ = ' + fmt(s.g) + ' m/s² (' + fmt(s.ratio * 100) + ' % ของที่ผิว)', ox, oy, { dy: 40, align: 'center', color: c.red });
      var gx0 = 4.3, gy0 = -1.9, gw = 2.8, gh = 2.2;
      D.rect(gx0, gy0, gw, gh, { fill: c.card, stroke: c.line });
      D.label('g กับ r (จาก R ถึง R + 40,000 km)', gx0, gy0 + gh, { dy: -8, color: c.muted });
      var pts = []; for (var i = 0; i <= 40; i++) { var rr = s.b.R + (maxR - s.b.R) * i / 40; var gg = G * s.b.M / (rr * rr); pts.push([gx0 + gw * i / 40, gy0 + 0.05 + (gh - 0.3) * gg / s.g0]); }
      D.polyline(pts, { color: c.primary, width: 2 });
      D.dot(gx0 + gw * (s.r - s.b.R) / (maxR - s.b.R), gy0 + 0.05 + (gh - 0.3) * s.ratio, 5, c.red);
      D.label('g₀ = ' + fmt(s.g0), gx0 + 0.05, gy0 + gh - 0.25, { color: c.primary }); D.label('r', gx0 + gw, gy0, { dx: 4, dy: -6 });
      D.line(gx0 + gw * (s.b.R) / (maxR - s.b.R), gy0, gx0 + gw * (s.b.R) / (maxR - s.b.R), gy0 + gh, { color: c.line, dash: [3, 3], width: 1 }); D.label('2R', gx0 + gw * (s.b.R) / (maxR - s.b.R), gy0, { dy: 10, align: 'center' });
    },
    dragHandles: function (s, p) { var maxR = s.b.R + 40000e3; return [{ param: 'h', x: 1 + (s.r - s.b.R) / (maxR - s.b.R) * 2.6, y: 0, r: 12, map: function (wx) { return PhysLab.clamp((wx - 1) / 2.6 * 40000, 0, 40000); } }]; },
    readouts: function (s, p) {
      return [
        { label: 'r = R + h', value: s.r / 1000, unit: 'km' }, { label: 'g ที่ระยะ r', value: s.g, unit: 'm/s²', highlight: true },
        { label: 'แรงโน้มถ่วง F', value: s.F, unit: 'N', highlight: true }, { label: 'น้ำหนักที่ผิวดาว', value: s.W0, unit: 'N' },
        { label: 'g ที่ผิว g₀', value: s.g0, unit: 'm/s²' }, { label: 'g/g₀', value: s.ratio, sig: 3 }
      ];
    },
    formulas: function (s, p) {
      return [
        { symbolic: 'F = GMm / r²', substituted: '= (6.67×10⁻¹¹)(' + fmt(s.b.M) + ')(' + p.m + ') / (' + fmt(s.r) + ')²', result: '= ' + fmt(s.F) + ' N' },
        { symbolic: 'g = GM / r²', substituted: '= (6.67×10⁻¹¹)(' + fmt(s.b.M) + ') / (' + fmt(s.r) + ')²', result: '= ' + fmt(s.g) + ' m/s²' },
        { symbolic: 'ดาวเทียมสูง h: r = R + h', substituted: '= ' + fmt(s.b.R / 1000) + ' + ' + fmt(p.h) + ' km', result: '= ' + fmt(s.r / 1000) + ' km' }
      ];
    },
    content: {
      summary: '<b>แรงโน้มถ่วง</b> มวลสองก้อนดึงดูดกันด้วยแรง F = GMm/R² ยิ่งไกลแรงยิ่งลดลงเร็ว <b>สนามโน้มถ่วง (ค่า g)</b> ความเร่งที่ดาวดึงวัตถุ g = GM/R² ค่า g ที่ผิวโลกประมาณ 9.8 m/s² <b>ดาวเทียม</b> ดาวเทียมสูงจากผิวดาว r ให้ใช้ระยะจากศูนย์กลางดาว คือ R + r แทน R ในสูตรแรงโน้มถ่วงและค่า g',
      tryIt: ['ลากวัตถุให้ h = 6,370 km (เท่ารัศมีโลก) ดูว่า g เหลือ 1/4 เพราะ r เป็น 2 เท่า', 'เลือกสถานีอวกาศ 400 km ดูว่า g ยังเกือบ 9 m/s² นักบินอวกาศลอยเพราะกำลังตกรอบโลก ไม่ใช่เพราะไม่มีแรงโน้มถ่วง', 'เปลี่ยนเป็นดวงจันทร์ ดูว่า g ที่ผิวประมาณ 1.6 m/s²']
    }
  });
})();
</script>
</body>
</html>
