<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S20.5 ปฏิยานุภาคและการสลายตัวแบบบีตา · Physics Lab</title>
<link rel="stylesheet" href="../lib/physlab.css">
<script src="../lib/physlab.js"></script>
</head>
<body>
<main id="sim"></main>
<script>
/* S20.5 ปฏิยานุภาคและการสลายตัวแบบบีตา · บท 20 เรื่อง 14, 16
   หลัก: e⁻ + e⁺ → γ + γ (แต่ละ γ 0.511 MeV ออกทิศตรงข้ามเพื่ออนุรักษ์โมเมนตัม) · β⁻: n → p + e⁻ + ν̄ (d → u + W⁻) · β⁺: p → n + e⁺ + ν (u → d + W⁺) ผ่านแรงอ่อน
   แอนิเมชันตามเวลา · แก้ไขล่าสุด 2026-10-27 */
(function () {
  var fmt = PhysLab.fmt;
  function init() { return { u: 0 }; }
  function step(s, p, dt) { s.u = Math.min(1, s.u + dt * 0.3); return s; }
  PhysLab.createSim({
    id: 'S20.5', chapter: 20, topics: [14, 16], title: 'ปฏิยานุภาคและการสลายตัวแบบบีตา',
    alt: 'โหมดประลัย: อิเล็กตรอนและโพซิตรอนวิ่งเข้าหากัน หายไปกลายเป็นรังสีแกมมาสองลำพุ่งออกทิศตรงข้าม โหมดสลายบีตา: นิวตรอนกลายเป็นโปรตอน ปล่อยอิเล็กตรอนและแอนตินิวทริโนผ่าน W โบซอน แสดงระดับควาร์ก d เปลี่ยนเป็น u',
    params: {
      mode: { label: 'หัวข้อ', type: 'choice', options: [{ label: 'อนุภาคพบปฏิยานุภาค (ประลัย)', value: 'ann' }, { label: 'สลายบีตาลบ n → p', value: 'bm' }, { label: 'สลายบีตาบวก p → n', value: 'bp' }], default: 'ann' }
    },
    presets: [{ label: 'e⁻ + e⁺ → γ + γ', values: { mode: 'ann' } }, { label: 'บีตาลบ (เช่น C-14)', values: { mode: 'bm' } }, { label: 'บีตาบวก (เช่น Na-22)', values: { mode: 'bp' } }],
    speeds: [0.5, 1], dt: 1 / 120,
    world: { xMin: 0, xMax: 10, yMin: 0, yMax: 5.2 },
    init: init, step: step,
    timeLabel: function (t, s) { return 'ความคืบหน้า ' + fmt(s.u * 100, 2) + '%'; },
    done: function (s) { return s.u >= 1; },
    draw: function (ctx, s, p, D) {
      var c = D.color, u = s.u, cx = 5, cy = 2.8;
      if (p.mode === 'ann') {
        if (u < 0.5) { var g = 3.5 * (1 - u / 0.5); D.dot(cx - g / 2, cy, 9, c.primary, { stroke: c.card, width: 2 }); D.label('e⁻', cx - g / 2, cy + 0.35, { align: 'center', color: c.primary, bold: true }); D.dot(cx + g / 2, cy, 9, c.red, { stroke: c.card, width: 2 }); D.label('e⁺', cx + g / 2, cy + 0.35, { align: 'center', color: c.red, bold: true }); D.label('มวลเท่ากัน 0.511 MeV/c² ประจุตรงข้าม', cx, 1.6, { align: 'center', color: c.text }); }
        else { var d = 4.0 * (u - 0.5) / 0.5; ctx.save(); ctx.globalAlpha = Math.max(0, 0.6 - d * 0.3); D.circle(cx, cy, 0.4 + d * 0.5, { fill: '#FFD54F' }); ctx.restore(); [[-1, 0.5], [1, -0.5]].forEach(function (dir) { var pts = []; for (var i = 0; i <= 30; i++) { var x = cx + dir[0] * d * i / 30; pts.push([x, cy + dir[1] * 0.4 * d * i / 30 + 0.12 * Math.sin(i * 1.3)]); } D.polyline(pts, { color: c.green, width: 2.5 }); D.arrow(cx + dir[0] * d, cy + dir[1] * 0.4 * d, dir[0] * 0.3, dir[1] * 0.12, { color: c.green, width: 2.5 }); D.label('γ 0.511 MeV', cx + dir[0] * d, cy + dir[1] * 0.4 * d + 0.35, { align: 'center', color: c.green, bold: true }); }); D.label('ประลัย: มวลทั้งหมดกลายเป็นพลังงาน 2 × 0.511 = 1.022 MeV · โฟตอนสองตัวออกทิศตรงข้าม (อนุรักษ์โมเมนตัม)', cx, 1.4, { align: 'center', color: c.text }); }
        D.label('e⁻ + e⁺ → γ + γ · ทุกอนุภาคมีคู่ตรงข้ามที่มวลเท่ากันแต่ประจุตรงข้าม (ใช้ในเครื่อง PET scan)', 0.3, 4.95, { color: c.text, bold: true });
      } else {
        var bm = p.mode === 'bm', from = bm ? ['d', 'u', 'd'] : ['u', 'u', 'd'], to = bm ? ['u', 'u', 'd'] : ['u', 'd', 'd'], chg = bm ? 0 : 0;
        D.line(0.8, 1.2, 9.2, 1.2, { color: c.line, width: 1 }); D.arrow(8.6, 1.2, 0.6, 0, { color: c.line, width: 1 }); D.label('เวลา →', 9.2, 1.0, { dy: 8, align: 'right', color: c.muted });
        var nx = 2.2, px = 7.6, qx = nx + (px - nx) * u;
        [0, 1, 2].forEach(function (i) { var yy = cy + 0.5 - i * 0.5, lab = u < 0.5 ? from[i] : to[i], col = lab === 'u' ? c.primary : c.green; D.line(nx, yy, qx, yy, { color: i === (bm ? 0 : 1) ? (u > 0.5 ? c.green : c.primary) : col, width: 3 }); D.dot(qx, yy, 7, col, {}); D.label(lab, qx + 0.2, yy, { color: col, bold: true }); });
        D.label(bm ? 'นิวตรอน n (udd) ประจุ 0' : 'โปรตอน p (uud) ประจุ +1', nx, cy + 1.1, { align: 'center', color: c.text, bold: true });
        if (u > 0.45) { var wx = nx + (px - nx) * 0.5, wy = cy + 0.5 - (bm ? 0 : 1) * 0.5, L = PhysLab.clamp((u - 0.45) / 0.55, 0, 1); var pts = []; for (var i = 0; i <= 30; i++) { var t = i / 30 * L; pts.push([wx + 2.0 * t, wy - 1.4 * t + 0.1 * Math.sin(i * 1.5)]); } D.polyline(pts, { color: c.orange, width: 2.5 }); D.label(bm ? 'W⁻' : 'W⁺', wx + 1.0 * L + 0.2, wy - 0.7 * L, { color: c.orange, bold: true }); if (L > 0.6) { var ex = wx + 2.0 * L, ey = wy - 1.4 * L; D.arrow(ex, ey, 0.9, -0.3, { color: c.red, width: 2.5, label: bm ? 'e⁻' : 'e⁺', dx: 10 }); D.arrow(ex, ey, 0.9, -0.9, { color: c.muted, width: 2, label: bm ? 'ν̄ (แอนตินิวทริโน)' : 'ν (นิวทริโน)', dx: 10 }); } }
        if (u >= 1) D.label(bm ? 'โปรตอน p (uud) ประจุ +1' : 'นิวตรอน n (udd) ประจุ 0', px, cy + 1.1, { align: 'center', color: c.text, bold: true });
        D.label(bm ? 'บีตาลบ: n → p + e⁻ + ν̄ · ระดับควาร์ก d → u + W⁻ แล้ว W⁻ → e⁻ + ν̄ (แรงอ่อน)' : 'บีตาบวก: p → n + e⁺ + ν · ระดับควาร์ก u → d + W⁺ แล้ว W⁺ → e⁺ + ν (แรงอ่อน)', 0.3, 4.95, { color: c.text, bold: true });
        D.label(bm ? 'เลขอะตอม Z เพิ่ม 1 เลขมวล A เท่าเดิม · ประจุอนุรักษ์: 0 = +1 + (−1) + 0' : 'เลขอะตอม Z ลด 1 เลขมวล A เท่าเดิม · ประจุอนุรักษ์: +1 = 0 + (+1) + 0', 0.3, 0.4, { color: c.primary });
      }
    },
    readouts: function (s, p) { if (p.mode === 'ann') return [{ label: 'มวล e⁻ = e⁺', value: 0.511, unit: 'MeV/c²' }, { label: 'พลังงาน γ แต่ละตัว', value: 0.511, unit: 'MeV', highlight: true }, { label: 'พลังงานรวม', value: 1.022, unit: 'MeV' }, { label: 'λ ของ γ = hc/E', value: 6.63e-34 * 3e8 / (0.511e6 * 1.6e-19), unit: 'm' }]; var bm = p.mode === 'bm'; return [{ label: 'ปฏิกิริยา', value: bm ? 'n → p + e⁻ + ν̄' : 'p → n + e⁺ + ν', highlight: true }, { label: 'ระดับควาร์ก', value: bm ? 'd → u + W⁻' : 'u → d + W⁺' }, { label: 'Z เปลี่ยน', value: bm ? '+1' : '−1' }, { label: 'A เปลี่ยน', value: '0' }, { label: 'แรงที่รับผิดชอบ', value: 'แรงอ่อน (W โบซอน)' }]; },
    formulas: function (s, p) { if (p.mode === 'ann') return [{ symbolic: 'E = mc²', substituted: '= 2 × 0.511 MeV', result: '= 1.022 MeV' }]; return [{ symbolic: 'อนุรักษ์ประจุ', substituted: p.mode === 'bm' ? '0 = (+1) + (−1) + 0' : '+1 = 0 + (+1) + 0', result: 'ดุลกัน' }]; },
    content: {
      summary: '<b>อนุภาคและปฏิยานุภาค</b> ทุกอนุภาคมีคู่ตรงข้ามที่มวลเท่ากันแต่ประจุตรงข้าม เช่น อิเล็กตรอนกับโพซิตรอน เจอกันแล้วประลัยกลายเป็นพลังงานแกมมา e⁻ + e⁺ → γ + γ <b>การสลายตัวแบบบีตา</b> บีตาลบ นิวตรอนกลายเป็นโปรตอน ปล่อยอิเล็กตรอนและแอนตินิวทริโน บีตาบวก โปรตอนกลายเป็นนิวตรอน ปล่อยโพซิตรอนและนิวทริโน ทั้งคู่เกิดจากแรงอ่อนผ่าน W โบซอน ที่ระดับควาร์กคือ d ↔ u',
      tryIt: ['กดเล่นโหมดประลัย ดูว่าโฟตอนสองตัวพุ่งออกทิศตรงข้ามเสมอ', 'โหมดบีตาลบ: สังเกตว่าควาร์ก d ตัวหนึ่งเปลี่ยนเป็น u ทำให้ udd กลายเป็น uud', 'สลับเป็นบีตาบวก ดูว่าเป็นกระบวนการตรงข้ามและปล่อยโพซิตรอนแทน']
    }
  });
})();
</script>
</body>
</html>
