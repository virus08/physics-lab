<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S19.3 ปรากฏการณ์โฟโตอิเล็กทริก · Physics Lab</title>
<link rel="stylesheet" href="../lib/physlab.css">
<script src="../lib/physlab.js"></script>
</head>
<body>
<main id="sim"></main>
<script>
/* S19.3 ปรากฏการณ์โฟโตอิเล็กทริก · บท 19 เรื่อง 4
   สูตร: hf = W + KE max · f₀ = W/h · KE max = eV_s · ความเข้มเพิ่มจำนวนอิเล็กตรอนแต่ไม่เพิ่มพลังงาน
   แอนิเมชันอิเล็กตรอนหลุดจากโลหะ (จำนวน ∝ ความเข้ม, ความเร็ว ∝ √KE) · แก้ไขล่าสุด 2026-10-27 */
(function () {
  var fmt = PhysLab.fmt, h = 6.63e-34, c0 = 3e8, e = 1.6e-19, rng = PhysLab.rng(3);
  var MET = [{ label: 'ซีเซียม W = 2.1 eV', value: 2.1 }, { label: 'โซเดียม 2.3 eV', value: 2.3 }, { label: 'สังกะสี 4.3 eV', value: 4.3 }, { label: 'ทองแดง 4.7 eV', value: 4.7 }];
  function calc(p) { var lam = p.lam * 1e-9, f = c0 / lam, Eph = h * f / e, KE = Eph - p.W, f0 = p.W * e / h; return { f: f, Eph: Eph, KE: KE, ok: KE > 0, f0: f0, lam0: c0 / f0 * 1e9, Vs: KE > 0 ? KE : 0 }; }
  function wl2rgb(l) { var r, g, b; if (l < 380) return '#8a5cf6'; if (l < 440) { r = -(l - 440) / 60; g = 0; b = 1; } else if (l < 490) { r = 0; g = (l - 440) / 50; b = 1; } else if (l < 510) { r = 0; g = 1; b = -(l - 510) / 20; } else if (l < 580) { r = (l - 510) / 70; g = 1; b = 0; } else if (l < 645) { r = 1; g = -(l - 645) / 65; b = 0; } else { r = 1; g = 0; b = 0; } return 'rgb(' + Math.round(255 * r) + ',' + Math.round(255 * g) + ',' + Math.round(255 * b) + ')'; }
  function init() { return { es: [], acc: 0, count: 0 }; }
  function step(s, p, dt, t) { var C = calc(p); if (C.ok) { s.acc += p.I * 2.5 * dt; while (s.acc >= 1) { s.acc -= 1; s.es.push({ x: 2.0, y: 1.3 + rng() * 2.0, vx: 0.6 + 1.6 * Math.sqrt(C.KE / 3), vy: (rng() - 0.5) * 0.6 }); s.count++; } } s.es.forEach(function (q) { q.x += q.vx * dt; q.y += q.vy * dt; }); s.es = s.es.filter(function (q) { return q.x < 7.6; }); return s; }
  PhysLab.createSim({
    id: 'S19.3', chapter: 19, topics: [4], title: 'ปรากฏการณ์โฟโตอิเล็กทริก',
    alt: 'แผ่นโลหะทางซ้ายถูกแสงสีตามความยาวคลื่นส่อง อิเล็กตรอนหลุดออกมาวิ่งไปทางขวาเมื่อความถี่ถึงขีดเริ่ม จำนวนอิเล็กตรอนเพิ่มตามความเข้ม ด้านขวาเป็นกราฟพลังงานจลน์สูงสุดกับความถี่ที่เป็นเส้นตรงความชัน h',
    calc: calc,
    params: {
      W: { label: 'โลหะ (ฟังก์ชันงาน)', type: 'choice', options: MET, default: 2.3 },
      lam: { label: 'ความยาวคลื่นแสง', symbol: 'λ', unit: 'nm', type: 'range', min: 100, max: 800, step: 5, default: 400 },
      I: { label: 'ความเข้มแสง', symbol: 'I', unit: 'หน่วยสัมพัทธ์', type: 'range', min: 0.2, max: 5, step: 0.2, default: 2 }
    },
    presets: [{ label: 'โซเดียม แสงม่วง 400 nm', values: { W: 2.3, lam: 400, I: 2 } }, { label: 'โซเดียม แสงแดง 700 nm (ไม่หลุด)', values: { W: 2.3, lam: 700, I: 5 } }, { label: 'ความเข้ม 5 เท่า (จำนวนมากขึ้น พลังงานเท่าเดิม)', values: { W: 2.3, lam: 400, I: 5 } }, { label: 'ยูวี 200 nm (พลังงานสูง)', values: { W: 2.3, lam: 200, I: 2 } }, { label: 'ทองแดง ต้องใช้ยูวี', values: { W: 4.7, lam: 250, I: 2 } }],
    speeds: [1], dt: 1 / 120,
    world: { xMin: 0, xMax: 10, yMin: 0, yMax: 5.2 },
    init: init, step: step,
    timeLabel: function (t, s) { return 'อิเล็กตรอนที่หลุดแล้ว ' + s.count; },
    draw: function (ctx, s, p, D) {
      var c = D.color, C = calc(p), col = wl2rgb(p.lam), i;
      D.rect(1.6, 1.0, 0.4, 2.6, { fill: c.muted }); D.label('โลหะ W = ' + p.W + ' eV', 1.8, 0.85, { dy: 6, align: 'center', color: c.text });
      for (i = 0; i < Math.round(2 + p.I * 1.5); i++) { var yy = 1.2 + 2.2 * (i + 0.5) / Math.round(2 + p.I * 1.5); D.arrow(0.3, yy + 0.5, 1.2, -0.5, { color: col, width: 2 }); }
      D.label('แสง λ = ' + p.lam + ' nm · f = ' + fmt(C.f) + ' Hz · E โฟตอน = hf = ' + fmt(C.Eph) + ' eV', 0.3, 4.95, { color: C.ok ? c.primary : c.red, bold: true });
      D.label(C.ok ? 'hf > W → อิเล็กตรอนหลุด KE max = hf − W = ' + fmt(C.KE) + ' eV · ความเข้ม ' + p.I + ' → จำนวน/วินาที ∝ ความเข้ม' : 'hf < W → ไม่หลุดเลย ไม่ว่าความเข้มจะมากแค่ไหน (ต้อง λ < ' + fmt(C.lam0) + ' nm)', 0.3, 4.65, { color: C.ok ? c.text : c.red });
      s.es.forEach(function (q) { D.dot(q.x, q.y, 4, c.primary, {}); });
      D.rect(7.6, 1.0, 0.15, 2.6, { fill: c.text }); D.label('ขั้วรับ', 7.7, 0.85, { dy: 6, align: 'center', color: c.text });
      var gx0 = 8.3, gx1 = 9.7, gy0 = 1.0, gy1 = 3.9, fmax = 3e15, kmax = 8; D.rect(gx0, gy0, gx1 - gx0, gy1 - gy0, { fill: c.card, stroke: c.line }); var X = function (f) { return gx0 + (gx1 - gx0) * f / fmax; }, Y = function (k) { return gy0 + (gy1 - gy0) * k / kmax; };
      D.line(X(C.f0), Y(0), X(fmax), Y((h * fmax / e) - p.W), { color: c.primary, width: 2 }); D.dot(X(C.f0), Y(0), 4, c.red, {}); D.label('f₀', X(C.f0), gy0, { dy: 12, align: 'center', color: c.red });
      if (C.ok) D.dot(X(C.f), Y(C.KE), 5, c.orange, { stroke: c.card, width: 1.5 }); D.label('KE max', gx0, gy1 + 0.05, { dy: -2, color: c.muted }); D.label('f', gx1, gy0, { dy: 12, align: 'right', color: c.muted }); D.label('ความชัน = h', gx0 + 0.1, gy1 - 0.2, { color: c.muted });
      D.label('ความถี่ขีดเริ่ม f₀ = W/h = ' + fmt(C.f0) + ' Hz (λ₀ = ' + fmt(C.lam0) + ' nm) · แรงดันหยุดยั้ง V_s = KE max/e = ' + fmt(C.Vs) + ' V', 0.3, 0.3, { color: c.text });
    },
    readouts: function (s, p) { var C = calc(p); return [{ label: 'E โฟตอน = hf', value: C.Eph, unit: 'eV', highlight: true }, { label: 'W', value: p.W, unit: 'eV' }, { label: 'KE max = hf − W', value: C.ok ? C.KE : 0, unit: 'eV', highlight: true }, { label: 'V_s = KE max/e', value: C.Vs, unit: 'V' }, { label: 'f₀ = W/h', value: C.f0, unit: 'Hz' }, { label: 'λ₀ = c/f₀', value: C.lam0, unit: 'nm' }, { label: 'ผล', value: C.ok ? 'หลุด' : 'ไม่หลุด' }]; },
    formulas: function (s, p) { var C = calc(p); return [{ symbolic: 'E = hf = hc/λ', substituted: '= 6.63×10⁻³⁴ × 3×10⁸ / ' + p.lam + '×10⁻⁹ ÷ 1.6×10⁻¹⁹', result: '= ' + fmt(C.Eph) + ' eV' }, { symbolic: 'hf = W + KE max', substituted: 'KE max = ' + fmt(C.Eph) + ' − ' + p.W, result: C.ok ? '= ' + fmt(C.KE) + ' eV' : '< 0 → ไม่หลุด' }, { symbolic: 'KE max = eV_s', substituted: 'V_s = ' + fmt(C.Vs), result: '= ' + fmt(C.Vs) + ' V' }]; },
    content: {
      summary: '<b>ปรากฏการณ์โฟโตอิเล็กทริก</b> แสงตกกระทบโลหะแล้วอิเล็กตรอนหลุดออก แต่ความถี่ต้องถึงค่าขีดเริ่มก่อน พลังงานโฟตอน = ฟังก์ชันงาน + พลังงานจลน์อิเล็กตรอน hf = W + eV_s ความเข้มแสงเพิ่มจำนวนอิเล็กตรอนแต่ไม่เพิ่มพลังงาน เป็นหลักฐานว่าแสงเป็นอนุภาค (โฟตอน) ที่มีพลังงาน hf',
      tryIt: ['ใช้แสงแดง 700 nm กับโซเดียม แล้วเพิ่มความเข้มสูงสุด ดูว่าไม่มีอิเล็กตรอนหลุดเลย', 'ลด λ จนต่ำกว่า λ₀ ดูอิเล็กตรอนเริ่มหลุด และยิ่ง λ สั้นยิ่งวิ่งเร็ว', 'คงความยาวคลื่นแล้วเพิ่มความเข้ม ดูว่าจำนวนเพิ่มแต่ KE max เท่าเดิม']
    }
  });
})();
</script>
</body>
</html>
