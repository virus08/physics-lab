<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S18.3 สเปกตรัมคลื่นแม่เหล็กไฟฟ้า · Physics Lab</title>
<link rel="stylesheet" href="../lib/physlab.css">
<script src="../lib/physlab.js"></script>
</head>
<body>
<main id="sim"></main>
<script>
/* S18.3 สเปกตรัมคลื่นแม่เหล็กไฟฟ้า · บท 18 เรื่อง 7
   หลัก: เรียงจาก λ สั้นไปยาว แกมมา เอกซ์ ยูวี แสง (400–700 nm) อินฟราเรด ไมโครเวฟ วิทยุ · c = fλ · E โฟตอน = hf
   แบบจำลองนิ่ง เลื่อนตัวชี้บนแกนลอการิทึม · แก้ไขล่าสุด 2026-10-27 */
(function () {
  var fmt = PhysLab.fmt, c0 = 3e8, h = 6.63e-34;
  var BANDS = [{ name: 'แกมมา', lo: -14, hi: -11, use: 'เตาปฏิกรณ์ รักษามะเร็ง', col: '#6B3FA0' }, { name: 'เอกซ์', lo: -11, hi: -8, use: 'เอกซเรย์กระดูก', col: '#4457C2' }, { name: 'ยูวี', lo: -8, hi: -6.4, use: 'วิตามินดี ฆ่าเชื้อ', col: '#7B5CFF' }, { name: 'แสง', lo: -6.4, hi: -6.15, use: '400–700 nm มองเห็น', col: '#ffffff' }, { name: 'อินฟราเรด', lo: -6.15, hi: -3, use: 'รีโมท กล้องความร้อน', col: '#C2412D' }, { name: 'ไมโครเวฟ', lo: -3, hi: -1, use: 'อุ่นอาหาร WIFI เรดาร์ GPS', col: '#E07A1F' }, { name: 'วิทยุ', lo: -1, hi: 4, use: 'สื่อสาร AM FM โทรทัศน์', col: '#0E6B57' }];
  function band(logl) { for (var i = 0; i < BANDS.length; i++) if (logl < BANDS[i].hi) return BANDS[i]; return BANDS[BANDS.length - 1]; }
  function wl2rgb(l) { var r, g, b; if (l < 440) { r = -(l - 440) / 60; g = 0; b = 1; } else if (l < 490) { r = 0; g = (l - 440) / 50; b = 1; } else if (l < 510) { r = 0; g = 1; b = -(l - 510) / 20; } else if (l < 580) { r = (l - 510) / 70; g = 1; b = 0; } else if (l < 645) { r = 1; g = -(l - 645) / 65; b = 0; } else { r = 1; g = 0; b = 0; } return 'rgb(' + Math.round(255 * r) + ',' + Math.round(255 * g) + ',' + Math.round(255 * b) + ')'; }
  PhysLab.createSim({
    id: 'S18.3', chapter: 18, topics: [7], title: 'สเปกตรัมคลื่นแม่เหล็กไฟฟ้า', static: true,
    alt: 'แถบสเปกตรัมแนวนอนบนแกนลอการิทึมของความยาวคลื่น จากแกมมาทางซ้ายถึงวิทยุทางขวา มีตัวชี้ลากได้ แสดงความถี่ ความยาวคลื่น พลังงานโฟตอน และตัวอย่างการใช้งานของย่านนั้น แถบแสงที่มองเห็นขยายให้เห็นสีรุ้ง',
    band: band,
    params: {
      logl: { label: 'log₁₀(λ เป็นเมตร) (ลากตัวชี้ได้)', type: 'range', min: -14, max: 4, step: 0.01, default: -6.3, drag: true }
    },
    presets: [{ label: 'รังสีแกมมา 10⁻¹² m', values: { logl: -12 } }, { label: 'เอกซเรย์ 10⁻¹⁰ m', values: { logl: -10 } }, { label: 'ยูวี 300 nm', values: { logl: -6.52 } }, { label: 'แสงเขียว 550 nm', values: { logl: -6.26 } }, { label: 'อินฟราเรด 10 µm', values: { logl: -5 } }, { label: 'ไมโครเวฟ 12 cm (เตาอบ 2.45 GHz)', values: { logl: -0.91 } }, { label: 'วิทยุ FM 3 m (100 MHz)', values: { logl: 0.48 } }],
    world: { xMin: 0, xMax: 10, yMin: 0, yMax: 5.2 },
    init: function () { return {}; }, step: function (s) { return s; },
    draw: function (ctx, s, p, D) {
      var c = D.color, x0 = 0.5, x1 = 9.5, X = function (lg) { return x0 + (x1 - x0) * (lg + 14) / 18; }, yb = 2.6, bh = 0.9, i;
      BANDS.forEach(function (b) { D.rect(X(b.lo), yb, X(b.hi) - X(b.lo), bh, { fill: b.col, stroke: c.card }); if (b.name !== 'แสง') D.label(b.name, (X(b.lo) + X(b.hi)) / 2, yb + bh / 2, { align: 'center', color: '#fff', bold: true }); });
      for (i = 0; i < 30; i++) { var l = 400 + 300 * i / 30; D.rect(X(-6.4) + (X(-6.15) - X(-6.4)) * i / 30, yb, (X(-6.15) - X(-6.4)) / 30 + 0.01, bh, { fill: wl2rgb(l) }); }
      for (var e = -14; e <= 4; e += 2) { D.line(X(e), yb, X(e), yb - 0.12, { color: c.text }); D.label('10' + String(e).replace('-', '⁻').replace(/\d/g, function (d) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]; }), X(e), yb - 0.15, { dy: 10, align: 'center', color: c.muted }); }
      D.label('λ (m) →  ยาวขึ้น · ความถี่และพลังงานโฟตอนลดลง', x1, yb - 0.5, { dy: 10, align: 'right', color: c.muted }); D.label('← λ สั้น ความถี่สูง พลังงานสูง', x0, yb - 0.5, { dy: 10, color: c.muted });
      var vx0 = 3.0, vx1 = 7.0; D.line(X(-6.4), yb + bh, vx0, 4.5, { color: c.line, width: 1 }); D.line(X(-6.15), yb + bh, vx1, 4.5, { color: c.line, width: 1 });
      for (i = 0; i < 60; i++) { var l2 = 400 + 300 * i / 60; D.rect(vx0 + (vx1 - vx0) * i / 60, 4.5, (vx1 - vx0) / 60 + 0.01, 0.45, { fill: wl2rgb(l2) }); }
      [400, 500, 600, 700].forEach(function (nm) { D.label(nm + ' nm', vx0 + (vx1 - vx0) * (nm - 400) / 300, 4.95, { dy: -2, align: 'center', color: c.muted }); }); D.label('แสงที่มองเห็น 400–700 nm (ม่วง → แดง)', 5.0, 4.3, { dy: 10, align: 'center', color: c.text });
      var lam = Math.pow(10, p.logl), f = c0 / lam, E = h * f, b = band(p.logl), xp = X(p.logl);
      D.line(xp, yb - 0.6, xp, yb + bh + 0.3, { color: c.red, width: 2 }); D.dot(xp, yb + bh + 0.3, 8, c.red, { stroke: c.card, width: 2 });
      D.label('ย่าน: ' + b.name + ' · ใช้: ' + b.use, 0.4, 1.5, { color: c.text, bold: true });
      D.label('λ = ' + fmt(lam) + ' m · f = c/λ = ' + fmt(f) + ' Hz · E โฟตอน = hf = ' + fmt(E) + ' J = ' + fmt(E / 1.6e-19) + ' eV', 0.4, 1.15, { color: c.primary });
      D.label('ทุกย่านคือคลื่นแม่เหล็กไฟฟ้าชนิดเดียวกัน เดินทางในสุญญากาศด้วย c = 3×10⁸ m/s ต่างกันแค่ความถี่/ความยาวคลื่น', 0.4, 0.5, { color: c.text });
    },
    dragHandles: function (s, p) { var x0 = 0.5, x1 = 9.5; return [{ param: 'logl', x: x0 + (x1 - x0) * (p.logl + 14) / 18, y: 2.6 + 0.9 + 0.3, r: 18, map: function (wx) { return PhysLab.clamp((wx - x0) / (x1 - x0) * 18 - 14, -14, 4); } }]; },
    readouts: function (s, p) { var lam = Math.pow(10, p.logl), f = c0 / lam; return [{ label: 'λ', value: lam, unit: 'm', highlight: true }, { label: 'f = c/λ', value: f, unit: 'Hz', highlight: true }, { label: 'E = hf', value: h * f / 1.6e-19, unit: 'eV' }, { label: 'ย่าน', value: band(p.logl).name }]; },
    formulas: function (s, p) { var lam = Math.pow(10, p.logl); return [{ symbolic: 'f = c/λ', substituted: '= 3×10⁸ / ' + fmt(lam), result: '= ' + fmt(c0 / lam) + ' Hz' }, { symbolic: 'E = hf', substituted: '= 6.63×10⁻³⁴ × ' + fmt(c0 / lam), result: '= ' + fmt(h * c0 / lam) + ' J' }]; },
    content: {
      summary: '<b>สเปกตรัมคลื่นแม่เหล็กไฟฟ้า</b> เรียงจากความยาวคลื่นสั้นไปยาว แกมมา (เตาปฏิกรณ์) เอกซ์ (เอกซเรย์) ยูวี (วิตามินดี ฆ่าเชื้อ) แสงที่มองเห็น (400 ถึง 700 nm) อินฟราเรด (รีโมท) ไมโครเวฟ (อุ่นอาหาร WIFI เรดาร์ GPS) และวิทยุ (สื่อสาร AM FM) ทุกย่านเดินทางด้วยอัตราเร็ว c เท่ากัน ความยาวคลื่นสั้นมีความถี่และพลังงานโฟตอนสูง',
      tryIt: ['ลากตัวชี้จากซ้ายไปขวา ดูว่าความถี่ลดลงและพลังงานโฟตอนลดลง', 'หาความถี่ของไมโครเวฟในเตาอบ (λ ≈ 12 cm)', 'เทียบพลังงานโฟตอนของรังสีเอกซ์กับแสงเขียว ว่าต่างกันกี่เท่า'],
      reference: { title: 'ย่านและการใช้งาน', columns: ['ย่าน', 'λ โดยประมาณ', 'การใช้งาน'], rows: BANDS.map(function (b) { return [b.name, '10^' + b.lo + ' ถึง 10^' + b.hi + ' m', b.use]; }) }
    }
  });
})();
</script>
</body>
</html>
