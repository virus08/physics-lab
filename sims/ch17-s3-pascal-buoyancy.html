<script>
/* S17.3 กฎของปาสคัลและแรงพยุง · บท 17 เรื่อง 7, 8
   สูตร: F₁/A₁ = F₂/A₂ · ระยะเลื่อน A₁d₁ = A₂d₂ (งานเท่ากัน) · F_B = ρ เหลว V จม g · ลอยเมื่อ ρ วัตถุ < ρ เหลว สัดส่วนที่จม = ρ วัตถุ/ρ เหลว
   แบบจำลองนิ่ง · แก้ไขล่าสุด 2026-10-27 */
(function () {
  var fmt = PhysLab.fmt, g = 9.8;
  var FLUID = [{ label: 'น้ำ 1000', value: 1000 }, { label: 'น้ำทะเล 1030', value: 1030 }, { label: 'น้ำมัน 800', value: 800 }, { label: 'ปรอท 13600', value: 13600 }];
  function pascal(p) { return { P: p.F1 / (p.A1 * 1e-4), F2: p.F1 * p.A2 / p.A1, d2: p.d1 * p.A1 / p.A2, W1: p.F1 * p.d1 * 1e-2, W2: p.F1 * p.A2 / p.A1 * p.d1 * p.A1 / p.A2 * 1e-2 }; }
  function buoy(p) { var V = p.V * 1e-3, W = p.rho * V * g, floats = p.rho < p.rhof, frac = floats ? p.rho / p.rhof : 1, FB = p.rhof * V * frac * g; return { V: V, W: W, floats: floats, frac: frac, FB: FB, app: W - FB }; }
  PhysLab.createSim({
    id: 'S17.3', chapter: 17, topics: [7, 8], title: 'กฎของปาสคัลและแรงพยุง', static: true,
    alt: 'โหมดปาสคัล: แม่แรงไฮดรอลิกมีลูกสูบเล็กและใหญ่ แรงน้อยที่ลูกสูบเล็กยกน้ำหนักมากที่ลูกสูบใหญ่ โหมดแรงพยุง: ก้อนวัตถุในถังของเหลว ลอยโดยจมบางส่วนหรือจมถึงก้น มีลูกศรน้ำหนักและแรงพยุง',
    pascal: pascal, buoy: buoy,
    params: {
      mode: { label: 'หัวข้อ', type: 'choice', options: [{ label: 'กฎของปาสคัล (แม่แรง)', value: 'pascal' }, { label: 'แรงพยุง', value: 'buoy' }], default: 'pascal' },
      F1: { label: 'แรงที่ลูกสูบเล็ก', symbol: 'F₁', unit: 'N', type: 'range', min: 10, max: 1000, step: 10, default: 100 },
      A1: { label: 'พื้นที่ลูกสูบเล็ก', symbol: 'A₁', unit: 'cm²', type: 'range', min: 1, max: 50, step: 1, default: 5 },
      A2: { label: 'พื้นที่ลูกสูบใหญ่', symbol: 'A₂', unit: 'cm²', type: 'range', min: 10, max: 1000, step: 10, default: 200 },
      d1: { label: 'ระยะกดลูกสูบเล็ก', symbol: 'd₁', unit: 'cm', type: 'range', min: 0, max: 50, step: 1, default: 20 },
      rho: { label: 'ความหนาแน่นวัตถุ (โหมดแรงพยุง)', symbol: 'ρ วัตถุ', unit: 'kg/m³', type: 'range', min: 100, max: 3000, step: 10, default: 600 },
      rhof: { label: 'ของเหลว (ความหนาแน่น)', type: 'choice', options: FLUID, default: 1000 },
      V: { label: 'ปริมาตรวัตถุ', symbol: 'V', unit: 'L', type: 'range', min: 0.5, max: 10, step: 0.5, default: 2 }
    },
    presets: [{ label: 'แม่แรง A₂/A₁ = 40 เท่า', values: { mode: 'pascal', F1: 100, A1: 5, A2: 200, d1: 20 } }, { label: 'ลูกสูบใหญ่ 1000 cm²', values: { mode: 'pascal', A2: 1000 } }, { label: 'ไม้ 600 ลอยในน้ำ (จม 60%)', values: { mode: 'buoy', rho: 600, rhof: 1000, V: 2 } }, { label: 'น้ำแข็ง 920 ในน้ำทะเล', values: { mode: 'buoy', rho: 920, rhof: 1030 } }, { label: 'เหล็ก 7800 → ใช้ค่าสูงสุด 3000 (จม)', values: { mode: 'buoy', rho: 3000, rhof: 1000 } }, { label: 'เหล็กลอยในปรอท', values: { mode: 'buoy', rho: 3000, rhof: 13600 } }],
    world: { xMin: 0, xMax: 10, yMin: 0, yMax: 5.2 },
    init: function () { return {}; }, step: function (s) { return s; },
    draw: function (ctx, s, p, D) {
      var c = D.color, i;
      if (p.mode === 'pascal') {
        var C = pascal(p), w1 = 0.5 + 0.6 * Math.sqrt(p.A1 / 50), w2 = 0.8 + 2.2 * Math.sqrt(p.A2 / 1000), x1 = 2.2, x2 = 6.5, yl = 1.0, lift = 0.3 + 1.2 * PhysLab.clamp(C.d2 / 10, 0, 1), press = 0.3 + 1.2 * PhysLab.clamp(p.d1 / 50, 0, 1);
        D.rect(x1 - w1 / 2, yl, w1, 2.6, { fill: '#9EC9F5' }); D.rect(x2 - w2 / 2, yl, w2, 2.6, { fill: '#9EC9F5' }); D.rect(x1, yl, x2 - x1, 0.7, { fill: '#9EC9F5' });
        D.line(x1 - w1 / 2, 3.8, x1 - w1 / 2, yl, { color: c.text, width: 2 }); D.line(x1 - w1 / 2, yl, x2 + w2 / 2, yl, { color: c.text, width: 2 }); D.line(x2 + w2 / 2, yl, x2 + w2 / 2, 3.8, { color: c.text, width: 2 }); D.line(x1 + w1 / 2, 3.8, x1 + w1 / 2, yl + 0.7, { color: c.text, width: 2 }); D.line(x1 + w1 / 2, yl + 0.7, x2 - w2 / 2, yl + 0.7, { color: c.text, width: 2 }); D.line(x2 - w2 / 2, yl + 0.7, x2 - w2 / 2, 3.8, { color: c.text, width: 2 });
        var y1 = yl + 2.6 - press + 0.6, y2 = yl + 2.6 - 0.6 + lift; D.rect(x1 - w1 / 2, yl, w1, 2.6, { fill: c.bg }); D.rect(x2 - w2 / 2, yl, w2, 2.6, { fill: c.bg }); D.rect(x1 - w1 / 2, yl, w1, y1 - yl, { fill: '#9EC9F5' }); D.rect(x2 - w2 / 2, yl, w2, y2 - yl, { fill: '#9EC9F5' }); D.rect(x1, yl, x2 - x1, 0.7, { fill: '#9EC9F5' });
        D.rect(x1 - w1 / 2, y1, w1, 0.2, { fill: c.muted }); D.rect(x2 - w2 / 2, y2, w2, 0.2, { fill: c.muted });
        D.arrow(x1, y1 + 1.3, 0, -1.0, { color: c.orange, width: 3, label: 'F₁ = ' + p.F1 + ' N' }); D.rect(x2 - w2 / 2 + 0.1, y2 + 0.2, w2 - 0.2, 0.5, { fill: c.orange }); D.label('ยกได้ F₂ = ' + fmt(C.F2) + ' N', x2, y2 + 0.75, { dy: -4, align: 'center', color: c.orange, bold: true });
        D.label('A₁ = ' + p.A1 + ' cm²', x1, 0.6, { dy: 6, align: 'center', color: c.text }); D.label('A₂ = ' + p.A2 + ' cm²', x2, 0.6, { dy: 6, align: 'center', color: c.text });
        D.label('P = F₁/A₁ = ' + fmt(C.P / 1000) + ' kPa ส่งไปเท่ากันทุกจุด', (x1 + x2) / 2, yl + 0.35, { align: 'center', color: c.primary, bold: true });
        D.label('F₂ = F₁ × A₂/A₁ = ' + p.F1 + ' × ' + p.A2 + '/' + p.A1 + ' = ' + fmt(C.F2) + ' N · ได้แรงเพิ่ม ' + fmt(p.A2 / p.A1) + ' เท่า', 0.3, 4.95, { color: c.primary, bold: true });
        D.label('กด d₁ = ' + p.d1 + ' cm → ยกขึ้น d₂ = d₁A₁/A₂ = ' + fmt(C.d2) + ' cm · งาน F₁d₁ = F₂d₂ = ' + fmt(C.W1) + ' J (ไม่ได้งานเพิ่ม)', 0.3, 4.65, { color: c.text });
      } else {
        var B = buoy(p), fl = FLUID.filter(function (f) { return f.value === p.rhof; })[0], bw = 1.2, bh = 1.2, top = 3.8, sub = B.frac * bh, yb = B.floats ? top - sub : 1.0;
        D.rect(1.5, 1.0, 4.0, 2.8, { fill: p.rhof > 5000 ? '#C9CDD3' : p.rhof < 900 ? '#F3D9A4' : '#9EC9F5' }); D.line(1.5, 4.3, 1.5, 1.0, { color: c.text, width: 3 }); D.line(1.5, 1.0, 5.5, 1.0, { color: c.text, width: 3 }); D.line(5.5, 1.0, 5.5, 4.3, { color: c.text, width: 3 });
        D.rect(3.5 - bw / 2, yb, bw, bh, { fill: c.orange, stroke: c.text }); D.label('ρ = ' + p.rho, 3.5, yb + bh / 2, { align: 'center', color: '#fff', bold: true });
        D.arrow(3.5 - 0.25, yb + bh / 2, 0, -(0.5 + 1.0 * PhysLab.clamp(B.W / 200, 0, 1)), { color: c.red, width: 3, label: 'W = ' + fmt(B.W) + ' N', dx: -10, align: 'right' }); D.arrow(3.5 + 0.25, yb + bh / 2, 0, 0.5 + 1.0 * PhysLab.clamp(B.FB / 200, 0, 1), { color: c.primary, width: 3, label: 'F_B = ' + fmt(B.FB) + ' N', dx: 10 });
        D.label(fl.label + ' kg/m³', 1.6, 1.15, { color: c.text });
        D.label(B.floats ? 'ลอย: จม ' + fmt(B.frac * 100) + '% ของปริมาตร (= ρ วัตถุ/ρ เหลว) · F_B = W' : 'จม: F_B = ρ เหลว V g = ' + fmt(B.FB) + ' N < W · น้ำหนักปรากฏ = ' + fmt(B.app) + ' N', 0.3, 4.95, { color: c.primary, bold: true });
        D.label('F_B = น้ำหนักของเหลวที่ถูกแทนที่ = ρ เหลว × V จม × g = ' + p.rhof + ' × ' + fmt(B.V * B.frac) + ' × 9.8', 0.3, 4.65, { color: c.text });
        D.rect(6.5, 1.0, 0.6, 2.8, { fill: c.soft }); D.rect(6.5, 1.0, 0.6, 2.8 * PhysLab.clamp(B.FB / Math.max(B.W, 1e-9), 0, 1), { fill: c.primary }); D.label('F_B/W = ' + fmt(B.FB / B.W), 6.8, 3.95, { align: 'center', color: c.primary });
        D.rect(7.6, 1.0, 0.6, 2.8, { fill: c.soft }); D.rect(7.6, 1.0, 0.6, 2.8 * PhysLab.clamp(p.rho / p.rhof, 0, 1), { fill: c.orange }); D.label('ρ วัตถุ/ρ เหลว = ' + fmt(p.rho / p.rhof), 7.9, 3.95, { align: 'center', color: c.orange });
      }
    },
    readouts: function (s, p) { if (p.mode === 'pascal') { var C = pascal(p); return [{ label: 'P = F₁/A₁', value: C.P, unit: 'Pa', highlight: true }, { label: 'F₂ = PA₂', value: C.F2, unit: 'N', highlight: true }, { label: 'อัตราส่วนแรง A₂/A₁', value: p.A2 / p.A1 }, { label: 'd₂ = d₁A₁/A₂', value: C.d2, unit: 'cm' }, { label: 'งาน F₁d₁ · F₂d₂', value: fmt(C.W1) + ' · ' + fmt(C.W2), unit: 'J' }]; } var B = buoy(p); return [{ label: 'W = ρVg', value: B.W, unit: 'N' }, { label: 'F_B = ρ เหลว V จม g', value: B.FB, unit: 'N', highlight: true }, { label: 'สภาพ', value: B.floats ? 'ลอย' : 'จม' }, { label: 'สัดส่วนที่จม', value: B.frac * 100, unit: '%', highlight: true }, { label: 'น้ำหนักปรากฏ W − F_B', value: B.app, unit: 'N' }]; },
    formulas: function (s, p) { if (p.mode === 'pascal') { var C = pascal(p); return [{ symbolic: 'F₁/A₁ = F₂/A₂', substituted: 'F₂ = ' + p.F1 + ' × ' + p.A2 + '/' + p.A1, result: '= ' + fmt(C.F2) + ' N' }, { symbolic: 'A₁d₁ = A₂d₂', substituted: 'd₂ = ' + p.d1 + ' × ' + p.A1 + '/' + p.A2, result: '= ' + fmt(C.d2) + ' cm' }]; } var B = buoy(p); return [{ symbolic: 'F_B = ρ เหลว V จม g', substituted: '= ' + p.rhof + ' × ' + fmt(B.V * B.frac) + ' × 9.8', result: '= ' + fmt(B.FB) + ' N' }, { symbolic: 'สัดส่วนที่จม = ρ วัตถุ/ρ เหลว', substituted: '= ' + p.rho + '/' + p.rhof, result: B.floats ? '= ' + fmt(B.frac) : '≥ 1 → จม' }]; },
    content: {
      summary: '<b>กฎของปาสคัล</b> ความดันที่ให้แก่ของเหลวในภาชนะปิดส่งไปเท่ากันทุกจุด F₁/A₁ = F₂/A₂ เป็นหลักของแม่แรงไฮดรอลิก ออกแรงน้อยที่ลูกสูบเล็ก ยกหนักที่ลูกสูบใหญ่ (แต่ต้องกดระยะทางมากกว่า งานเท่ากัน) <b>แรงพยุง</b> ของเหลวดันวัตถุขึ้นเท่ากับน้ำหนักของเหลวที่ถูกแทนที่ F_B = ρ เหลว V จม g วัตถุลอยเมื่อหนาแน่นน้อยกว่าของเหลว สัดส่วนที่จม = ρ วัตถุ/ρ เหลว',
      tryIt: ['เพิ่ม A₂ เป็น 1000 cm² ดูว่ายกได้ 200 เท่าของแรงที่กด แต่ยกขึ้นได้แค่ 1/200 ของระยะกด', 'โหมดแรงพยุง: ตั้ง ρ วัตถุ = 920 (น้ำแข็ง) ดูว่าจม 92% โผล่แค่ 8%', 'เปลี่ยนของเหลวเป็นปรอท ดูว่าวัตถุหนัก 3000 kg/m³ ก็ยังลอย']
    }
  });
})();
