<script>
/* S15.3 แรงบนลวดและโมเมนต์ของแรงคู่ควบ · บท 15 เรื่อง 6, 7, 8
   สูตร: F = LIB sinθ · ลวดคู่ F/L = μ₀I₁I₂/2πd (ตามกันดูด สวนกันผลัก) · M = BINA cosθ (θ ระหว่างระนาบขดกับ B)
   โหมดขดลวดเป็นแอนิเมชันหมุน · โหมดอื่นเป็นภาพนิ่ง · แก้ไขล่าสุด 2026-10-27 */
(function () {

  PhysLab.createSim({

    Fwire: Fwire, Fpair: Fpair, torque: torque,

    draw: function (ctx, s, p, D) {

        for (i = 0; i < 3; i++) { var rr = 0.35 + i * 0.3; D.circle(-dd, 0, rr, { stroke: c.line, width: 1, dash: [3, 3] }); D.circle(dd, 0, rr, { stroke: c.line, width: 1, dash: [3, 3] }); }
        D.line(-dd, -1.9, dd, -1.9, { color: c.text, width: 1 }); D.label('d = ' + p.d + ' m', 0, -1.9, { dy: 12, align: 'center', color: c.text });

        var w2 = 1.8, cs = Math.cos(s.th), sn = Math.sin(s.th), ex = w2 * cs, ey = w2 * sn, M = torque(p, s.th), Fs = p.B * p.I * p.N * Math.sqrt(p.A * 1e-4);
        D.line(-ex, -ey, ex, ey, { color: c.orange, width: 6 }); D.dot(0, 0, 5, c.text, {});
        var out = p.I >= 0; D.circle(ex, ey, 0.2, { fill: c.card, stroke: c.orange, width: 3 }); D.circle(-ex, -ey, 0.2, { fill: c.card, stroke: c.orange, width: 3 });
        if (out) { D.dot(ex, ey, 4, c.orange, {}); D.line(-ex - 0.12, -ey - 0.12, -ex + 0.12, -ey + 0.12, { color: c.orange, width: 2.5 }); D.line(-ex - 0.12, -ey + 0.12, -ex + 0.12, -ey - 0.12, { color: c.orange, width: 2.5 }); } else { D.dot(-ex, -ey, 4, c.orange, {}); D.line(ex - 0.12, ey - 0.12, ex + 0.12, ey + 0.12, { color: c.orange, width: 2.5 }); D.line(ex - 0.12, ey + 0.12, ex + 0.12, ey - 0.12, { color: c.orange, width: 2.5 }); }
        var fl = 0.4 + 0.8 * PhysLab.clamp(Math.abs(Fs) / 3, 0, 1), sg = out ? 1 : -1; D.arrow(ex, ey, 0, sg * fl, { color: c.green, width: 3, label: 'F' }); D.arrow(-ex, -ey, 0, -sg * fl, { color: c.green, width: 3, label: 'F' });
        D.label('ขดลวดมองด้านข้าง (แกนหมุนตั้งฉากจอ) · N = ' + p.N + ' · A = ' + p.A + ' cm² · I = ' + p.I + ' A', -4.8, 2.4, { color: c.text, bg: c.card });
        D.label('M = BINA cosθ = ' + fmt(Math.abs(M)) + ' N·m ที่ θ = ' + fmt(((deg(s.th) % 360) + 360) % 360) + '° · แขนโมเมนต์หดเมื่อขดตั้งฉาก B (cosθ → 0)', -4.8, -2.4, { color: c.green, bold: true, bg: c.card });
      }
    },
    readouts: function (s, p) { if (p.mode === 'wire') return [{ label: 'F = LIB sinθ', value: Math.abs(Fwire(p)), unit: 'N', highlight: true }, { label: 'ทิศ', value: Math.abs(Fwire(p)) < 1e-9 ? 'ไม่มีแรง' : (p.I * Math.sin(rad(p.th)) > 0 ? 'เข้ากระดาษ' : 'ออกจากกระดาษ') }, { label: 'F สูงสุด (θ = 90°)', value: Math.abs(p.L * p.I * p.B), unit: 'N' }]; if (p.mode === 'pair') return [{ label: 'F/L = μ₀I₁I₂/2πd', value: Math.abs(Fpair(p)), unit: 'N/m', highlight: true }, { label: 'ชนิด', value: p.I1 * p.I2 > 0 ? 'ดูดกัน' : p.I1 * p.I2 < 0 ? 'ผลักกัน' : 'ไม่มีแรง' }, { label: 'B จากลวด 1 ที่ลวด 2', value: mu0 * Math.abs(p.I1) / (2 * Math.PI * p.d), unit: 'T' }]; return [{ label: 'M = BINA cosθ', value: Math.abs(torque(p, s.th)), unit: 'N·m', highlight: true }, { label: 'M สูงสุด (θ = 0)', value: Math.abs(p.B * p.I * p.N * p.A * 1e-4), unit: 'N·m' }, { label: 'θ ขณะนี้', value: ((deg(s.th) % 360) + 360) % 360, unit: '°' }]; },
    formulas: function (s, p) { if (p.mode === 'wire') return [{ symbolic: 'F = LIB sinθ', substituted: '= ' + p.L + ' × ' + p.I + ' × ' + p.B + ' × sin' + p.th + '°', result: '= ' + fmt(Fwire(p)) + ' N' }]; if (p.mode === 'pair') return [{ symbolic: 'F/L = μ₀I₁I₂/2πd', substituted: '= 4π×10⁻⁷ × ' + p.I1 + ' × ' + p.I2 + ' / (2π × ' + p.d + ')', result: '= ' + fmt(Fpair(p)) + ' N/m' }]; return [{ symbolic: 'M = BINA cosθ', substituted: '= ' + p.B + ' × ' + p.I + ' × ' + p.N + ' × ' + p.A + '×10⁻⁴ × cos' + fmt(((deg(s.th) % 360) + 360) % 360) + '°', result: '= ' + fmt(torque(p, s.th)) + ' N·m' }]; },

    graphs: [{ title: 'โมเมนต์ M กับเวลา (โหมดขดลวด)', x: 't', series: [{ key: 'M', label: 'M (N·m)', color: '#0E6B57' }], window: 8 }],

      tryIt: ['โหมดลวดเดี่ยว: ลดมุมจาก 90° ไป 0° ดูว่าแรงลดลงจนเป็นศูนย์', 'โหมดลวดคู่: กลับทิศ I₂ ดูว่าลูกศรแรงเปลี่ยนจากดูดเป็นผลัก', 'โหมดขดลวด: กดเล่นแล้วดูกราฟ M เป็นรูป cos ค่าสูงสุดเมื่อระนาบขดขนาน B']
    }
