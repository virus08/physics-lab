<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S6.2 การชน 1 มิติ · Physics Lab</title>
<link rel="stylesheet" href="../lib/physlab.css">
<script src="../lib/physlab.js"></script>
</head>
<body>
<main id="sim"></main>
<script>
/* S6.2 การชน 1 มิติ · บท 6 เรื่อง 4, 5
   สูตร: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂ · ชนยืดหยุ่น e = 1 (Ek คงที่) · ไม่ยืดหยุ่น 0 < e < 1 · ไม่ยืดหยุ่นสมบูรณ์ e = 0 (ติดกันไป)
   v₁ = (m₁u₁ + m₂u₂ + m₂e(u₂ − u₁))/(m₁ + m₂) · v₂ = (m₁u₁ + m₂u₂ + m₁e(u₁ − u₂))/(m₁ + m₂) · แก้ไขล่าสุด 2026-10-27 */
(function () {
  var fmt = PhysLab.fmt;
  function after(p) { var M = p.m1 + p.m2, P = p.m1 * p.u1 + p.m2 * p.u2; return { v1: (P + p.m2 * p.e * (p.u2 - p.u1)) / M, v2: (P + p.m1 * p.e * (p.u1 - p.u2)) / M, P: P, Ek0: 0.5 * p.m1 * p.u1 * p.u1 + 0.5 * p.m2 * p.u2 * p.u2 }; }
  function w(m) { return 0.6 + m * 0.08; }
  function init(p) { return { x1: 1, x2: 7, v1: p.u1, v2: p.u2, hit: false, done: false }; }
  function step(s, p, dt) {
    if (s.done) return s;
    s.x1 += s.v1 * dt; s.x2 += s.v2 * dt;
    if (!s.hit && s.x1 + w(p.m1) >= s.x2 && s.v1 > s.v2) { var a = after(p); s.v1 = a.v1; s.v2 = a.v2; s.hit = true; s.x1 = s.x2 - w(p.m1); }
    if (s.x1 < -2 || s.x2 > 14 || (s.hit && Math.abs(s.v1) < 1e-4 && Math.abs(s.v2) < 1e-4)) s.done = true;
    return s;
  }
  PhysLab.createSim({
    id: 'S6.2', chapter: 6, topics: [4, 5], title: 'การชน 1 มิติ',
    alt: 'รถสองคันบนรางเส้นตรงวิ่งเข้าชนกัน มีลูกศรโมเมนตัมของแต่ละคัน และแถบเทียบโมเมนตัมรวมกับพลังงานจลน์ก่อนและหลังชน',
    after: after,
    params: {
      m1: { label: 'มวลคัน 1', symbol: 'm₁', unit: 'kg', type: 'range', min: 0.5, max: 10, step: 0.5, default: 2 },
      u1: { label: 'ความเร็วคัน 1', symbol: 'u₁', unit: 'm/s', type: 'range', min: -5, max: 8, step: 0.5, default: 3 },
      m2: { label: 'มวลคัน 2', symbol: 'm₂', unit: 'kg', type: 'range', min: 0.5, max: 10, step: 0.5, default: 1 },
      u2: { label: 'ความเร็วคัน 2', symbol: 'u₂', unit: 'm/s', type: 'range', min: -8, max: 5, step: 0.5, default: 0 },
      e: { label: 'ชนิดการชน', type: 'choice', options: [{ label: 'ยืดหยุ่น e = 1', value: 1 }, { label: 'ไม่ยืดหยุ่น e = 0.5', value: 0.5 }, { label: 'ติดกันไป e = 0', value: 0 }], default: 1 }
    },
    presets: [{ label: '2 kg ชน 1 kg นิ่ง (ยืดหยุ่น)', values: { m1: 2, u1: 3, m2: 1, u2: 0, e: 1 } }, { label: 'มวลเท่ากัน แลกความเร็ว', values: { m1: 2, u1: 3, m2: 2, u2: 0, e: 1 } }, { label: 'เบาชนหนัก สะท้อนกลับ', values: { m1: 1, u1: 4, m2: 8, u2: 0, e: 1 } }, { label: 'ติดกันไป', values: { m1: 2, u1: 3, m2: 1, u2: 0, e: 0 } }, { label: 'วิ่งเข้าหากัน', values: { m1: 2, u1: 3, m2: 2, u2: -3, e: 1 } }],
    toggles: [{ key: 'vec', label: 'ลูกศรโมเมนตัม' }],
    world: { xMin: -2, xMax: 14, yMin: -1.5, yMax: 4.2 },
    init: init, step: step, done: function (s) { return s.done; },
    draw: function (ctx, s, p, D) {
      var c = D.color, w1 = w(p.m1), w2 = w(p.m2), a = after(p);
      D.ground(0); D.line(-2, 0, 14, 0, { color: c.line, width: 2 });
      D.rect(s.x1, 0, w1, w1, { fill: c.primary }); D.label('m₁ ' + p.m1 + ' kg', s.x1 + w1 / 2, w1 + 0.25, { align: 'center' });
      D.rect(s.x2, 0, w2, w2, { fill: c.orange }); D.label('m₂ ' + p.m2 + ' kg', s.x2 + w2 / 2, w2 + 0.25, { align: 'center' });
      var kp = 1.5 / Math.max(Math.abs(p.m1 * p.u1) + Math.abs(p.m2 * p.u2), 1);
      if (D.view.vec) { if (Math.abs(s.v1) > 0.02) D.arrow(s.x1 + w1 / 2, w1 + 0.7, p.m1 * s.v1 * kp, 0, { color: c.primary, label: 'p₁ = ' + fmt(p.m1 * s.v1), width: 3 }); if (Math.abs(s.v2) > 0.02) D.arrow(s.x2 + w2 / 2, w2 + 0.7, p.m2 * s.v2 * kp, 0, { color: c.orange, label: 'p₂ = ' + fmt(p.m2 * s.v2), width: 3 }); }
      var Ek = 0.5 * p.m1 * s.v1 * s.v1 + 0.5 * p.m2 * s.v2 * s.v2;
      D.label((s.hit ? 'หลังชน: ' : 'ก่อนชน: ') + 'Σp = ' + fmt(p.m1 * s.v1 + p.m2 * s.v2) + ' kg·m/s · Ek = ' + fmt(Ek) + ' J (ก่อน ' + fmt(a.Ek0) + ' J)', -1.8, 3.9, { color: c.text });
      D.label(p.e === 1 ? 'ชนยืดหยุ่น: Ek ก่อน = หลัง' : p.e === 0 ? 'ชนไม่ยืดหยุ่นสมบูรณ์: Ek หายมากสุด ติดกันไป' : 'ชนไม่ยืดหยุ่น: Ek หายบางส่วน', -1.8, 3.5, {});
    },
    readouts: function (s, p) { var a = after(p), Ek = 0.5 * p.m1 * s.v1 * s.v1 + 0.5 * p.m2 * s.v2 * s.v2; return [{ label: 'v₁ หลังชน', value: a.v1, unit: 'm/s', highlight: true }, { label: 'v₂ หลังชน', value: a.v2, unit: 'm/s', highlight: true }, { label: 'Σp ก่อน', value: a.P, unit: 'kg·m/s' }, { label: 'Σp หลัง', value: p.m1 * a.v1 + p.m2 * a.v2, unit: 'kg·m/s' }, { label: 'Ek ก่อน', value: a.Ek0, unit: 'J' }, { label: 'Ek หลัง', value: 0.5 * p.m1 * a.v1 * a.v1 + 0.5 * p.m2 * a.v2 * a.v2, unit: 'J' }, { label: 'Ek ขณะนี้', value: Ek, unit: 'J' }, { label: 'Ek ที่หายไป', value: a.Ek0 - (0.5 * p.m1 * a.v1 * a.v1 + 0.5 * p.m2 * a.v2 * a.v2), unit: 'J', color: '#B42318' }]; },
    formulas: function (s, p) { var a = after(p); return [{ symbolic: 'm₁u₁ + m₂u₂ = m₁v₁ + m₂v₂', substituted: p.m1 + '(' + p.u1 + ') + ' + p.m2 + '(' + p.u2 + ') = ' + fmt(a.P), result: '= ' + p.m1 + '(' + fmt(a.v1) + ') + ' + p.m2 + '(' + fmt(a.v2) + ') ✓' }, { symbolic: 'e = (v₂ − v₁)/(u₁ − u₂)', substituted: '= (' + fmt(a.v2) + ' − ' + fmt(a.v1) + ')/(' + p.u1 + ' − ' + p.u2 + ')', result: '= ' + fmt(p.e) }]; },
    conserved: function (s, p) { var a = after(p); return [{ label: 'โมเมนตัมรวม', before: a.P, after: p.m1 * s.v1 + p.m2 * s.v2, unit: 'kg·m/s' }, { label: 'พลังงานจลน์รวม', before: a.Ek0, after: 0.5 * p.m1 * s.v1 * s.v1 + 0.5 * p.m2 * s.v2 * s.v2, unit: 'J' }]; },
    sample: function (s, p) { return { p1: p.m1 * s.v1, p2: p.m2 * s.v2, P: p.m1 * s.v1 + p.m2 * s.v2, Ek: 0.5 * p.m1 * s.v1 * s.v1 + 0.5 * p.m2 * s.v2 * s.v2 }; },
    graphs: [{ title: 'โมเมนตัมกับเวลา', x: 't', series: [{ key: 'p1', label: 'p₁' }, { key: 'p2', label: 'p₂', color: '#E07A1F' }, { key: 'P', label: 'Σp', color: '#0E6B57' }], window: 5 }, { title: 'พลังงานจลน์รวมกับเวลา', x: 't', series: [{ key: 'Ek', label: 'Ek (J)', color: '#B42318' }], window: 5 }],
    content: {
      summary: '<b>ชนิดของการชน</b> ทุกแบบโมเมนตัมรวมคงที่ ต่างกันที่พลังงานจลน์ ชนยืดหยุ่น Ek ก่อนเท่าหลัง ชนไม่ยืดหยุ่น Ek หายไปบางส่วน ชนไม่ยืดหยุ่นสมบูรณ์ Ek หายมากที่สุดและวัตถุติดกันไป <b>การชน 1 มิติ</b> ชนบนเส้นตรง ใช้ โมเมนตัมรวมก่อนชน = โมเมนตัมรวมหลังชน m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂',
      tryIt: ['เลือก "มวลเท่ากัน" ชนยืดหยุ่น ดูว่าคันแรกหยุดและคันสองวิ่งออกไปด้วยความเร็วเท่าเดิม', 'เลือก "ติดกันไป" ดูว่าโมเมนตัมยังคงที่แต่ Ek หายไปส่วนหนึ่ง', 'เลือก "เบาชนหนัก" ดูว่าคันเบาสะท้อนกลับ (v₁ ติดลบ)']
    }
  });
})();
</script>
</body>
</html>
